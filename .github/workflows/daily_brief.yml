name: Daily Morning AI & ML Brief

on:
  schedule:
    # GitHub's free runner queue has an ~8.5 hour backlog delay during peak hours.
    # Scheduled at 18:00 UTC (11:30 PM IST), GitHub's queue clears it to arrive by ~07:30 - 08:00 AM IST!
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / Mobile app anytime
  repository_dispatch: # Allows instant, 0-second-delay triggers from free external cron (e.g. cron-job.org)
    types: [daily_brief]

jobs:
  dispatch_newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install python-dotenv

      - name: Run Edition Generator and Send Email
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_RECEIVER_EMAIL: ${{ secrets.GMAIL_RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_newspaper_pdf.py --send
