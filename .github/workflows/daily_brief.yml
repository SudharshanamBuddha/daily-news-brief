name: Daily Morning AI & ML Brief

on:
  schedule:
    # 02:30 UTC corresponds exactly to 08:00 AM IST (UTC + 5:30)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / Mobile app anytime

jobs:
  dispatch_newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install python-dotenv

      - name: Run Edition Generator and Send Email
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_RECEIVER_EMAIL: ${{ secrets.GMAIL_RECEIVER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python generate_newspaper_pdf.py --send
